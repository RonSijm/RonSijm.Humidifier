name: Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies of Humidifier
      run: dotnet restore src/Humidifier/Humidifier.csproj

    - name: Restore dependencies of Humidifier.Json
      run: dotnet restore src/Humidifier.Json/Humidifier.Json.csproj

    - name: Combine version numbers
      run: |
        VERSION=$(cat src/version.txt)
        SPEC_VERSION=$(cat src/spec-version.txt | tr -d '.')
        FINAL_VERSION="${VERSION}.${SPEC_VERSION}"
        echo "FINAL_VERSION=$FINAL_VERSION" >> $GITHUB_ENV

    - name: Build Humidifier
      env:
        FINAL_VERSION: ${{ env.FINAL_VERSION }}
      run: dotnet build src/Humidifier --configuration Release /p:PackageVersion=$FINAL_VERSION /p:PackageOutputPath="$GITHUB_WORKSPACE/packages"
    
    - name: Build Humidifier.Json
      env:
        FINAL_VERSION: ${{ env.FINAL_VERSION }}
      run: dotnet build src/Humidifier.Json --configuration Release /p:PackageVersion=$FINAL_VERSION /p:PackageOutputPath="$GITHUB_WORKSPACE/packages"

    - name: Log in to NuGet with trusted publishing
      id: login
      uses: NuGet/login@v1
      with:
        user: Ron.Sijm

    - name: Publish to NuGet
      run: dotnet nuget push "./packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
