name: Publish NuGet Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        source: [src, src-dotnet11]
    defaults:
      run:
        working-directory: ${{ matrix.source }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref_name }}

    - name: Set up the SDK for this source track
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: ${{ matrix.source }}/global.json

    - name: Build NuGet packages
      shell: bash
      run: |
        VERSION="$(cat version.txt).$(tr -d '.' < spec-version.txt)"
        if [ -f version-suffix.txt ]; then VERSION="$VERSION-$(cat version-suffix.txt)"; fi
        dotnet restore Humidifier/Humidifier.csproj
        dotnet pack Humidifier/Humidifier.csproj -c Release --no-restore -p:PackageVersion="$VERSION" -p:Version="$VERSION" -p:GeneratePackageOnBuild=false -o "$GITHUB_WORKSPACE/packages/${{ matrix.source }}"
        dotnet restore Humidifier.Json/Humidifier.Json.csproj
        dotnet pack Humidifier.Json/Humidifier.Json.csproj -c Release --no-restore -p:PackageVersion="$VERSION" -p:Version="$VERSION" -p:GeneratePackageOnBuild=false -o "$GITHUB_WORKSPACE/packages/${{ matrix.source }}"

    - name: Log in to NuGet with trusted publishing
      id: login
      uses: NuGet/login@v1
      with:
        user: Ron.Sijm

    - name: Publish to NuGet
      run: dotnet nuget push "$GITHUB_WORKSPACE/packages/${{ matrix.source }}/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
