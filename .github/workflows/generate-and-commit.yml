name: Generate and Commit Changes

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: src/global.json
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: src-dotnet11/global.json
    - name: Regenerate stable resources
      working-directory: src
      run: dotnet run --project Humidifier.CodeGen.CLI -c WithoutReferences -f net10.0 -- -directory "$GITHUB_WORKSPACE/src"
    - name: Regenerate union resources
      working-directory: src-dotnet11
      run: dotnet run --project Humidifier.CodeGen.CLI -c WithoutReferences -f net11.0 -- -directory "$GITHUB_WORKSPACE/src-dotnet11"
    - name: Commit changes from both tracks
      id: changes
      shell: bash
      run: |
        git config user.email "RonSijm@Github.Action"
        git config user.name "Ron Sijm"
        git add src src-dotnet11
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Automated update of generated libraries"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-and-publish-nuget.yml
